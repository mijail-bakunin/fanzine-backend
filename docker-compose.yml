services:
  postgres:
    image: postgres:17-alpine
    container_name: laguillotina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laguillotina
      POSTGRES_USER: guillotina
      POSTGRES_PASSWORD: guillotina_dev
    ports:
      - "5432:5432"
    volumes:
      - laguillotina_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guillotina -d laguillotina"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  laguillotina_pgdata:
