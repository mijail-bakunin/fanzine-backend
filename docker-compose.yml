services:
  postgres:
    image: postgres:17-alpine
    container_name: laguillotina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laguillotina
      POSTGRES_USER: guillotina
      POSTGRES_PASSWORD: guillotina_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - laguillotina_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guillotina -d laguillotina"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: laguillotina-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: guillotina_test
      MINIO_ROOT_PASSWORD: guillotina_test_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - laguillotina_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: laguillotina-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 guillotina_test guillotina_test_secret;
      mc mb --ignore-existing local/laguillotina-test;
      mc anonymous set download local/laguillotina-test;
      "

volumes:
  laguillotina_pgdata:
  laguillotina_minio_data:
